<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dreamy Scheduler</title>
<!-- Tailwind CSS CDN with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e8306e',
            softPink: '#fff5f7',
            pastelPink: '#fce4ec',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          borderRadius: {
            'full-custom': '9999px',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-typography">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fff5f7; /* softPink */
      color: #4a4a4a;
    }
  </style>
<style data-purpose="layout-refinements">
    .glass-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .mini-calendar-day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }
  </style>
</head>
<body class="min-h-screen pb-10">
<!-- BEGIN: Hero Section -->
<header class="relative w-full h-64 overflow-hidden" data-purpose="decorative-header">
<img alt="Soft focus aesthetic flowers" class="w-full h-full object-cover opacity-80" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDfuDIy6WqpzDgAUy7lYBUPtMTuzss8FSuP-jzF6uSmwrCRa2dlffUnESf7uqtMBi7GZmTLTPAcB3UZRh2-THjbeG7OFZSmvMVs8i_vsWb1i0V9piskNHxaxy9JQK9nN_m3FVUYH1zYoKbBmntYEPyOLu0gbDcOuJLwqpr1U8_9vLytPoDjfcS7C1IIwyHfbtXJ7j4tNBUM3HuDlDqP5lSpLVzrDPX6OxAf4WzAyCS_QQmi0LRXtVaipDNZZYRio963zM-4DzIGE8g"/>
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-softPink/90 flex items-end p-6">
<h1 class="text-3xl font-bold text-gray-800 tracking-tight">Daily Glow</h1>
</div>
</header>
<!-- END: Hero Section -->
<main class="px-4 -mt-4 relative z-10 space-y-6">
<!-- BEGIN: Middle Dashboard -->
<section class="grid grid-cols-12 gap-4" data-purpose="middle-section">
<!-- Left: Mini Calendar -->
<div class="col-span-5 bg-white/80 p-3 rounded-3xl shadow-sm border border-pink-100" data-purpose="mini-calendar">
<div class="text-center mb-2">
<span class="text-[10px] uppercase tracking-widest font-semibold text-primary">October</span>
</div>
<div class="grid grid-cols-7 gap-1">
<!-- Calendar Days Header -->
<div class="mini-calendar-day font-bold text-primary">S</div>
<div class="mini-calendar-day font-bold text-primary">M</div>
<div class="mini-calendar-day font-bold text-primary">T</div>
<div class="mini-calendar-day font-bold text-primary">W</div>
<div class="mini-calendar-day font-bold text-primary">T</div>
<div class="mini-calendar-day font-bold text-primary">F</div>
<div class="mini-calendar-day font-bold text-primary">S</div>
<!-- Mock Calendar Dates -->
<div class="mini-calendar-day text-gray-300">28</div>
<div class="mini-calendar-day text-gray-300">29</div>
<div class="mini-calendar-day text-gray-300">30</div>
<div class="mini-calendar-day">1</div>
<div class="mini-calendar-day">2</div>
<div class="mini-calendar-day">3</div>
<div class="mini-calendar-day">4</div>
<div class="mini-calendar-day">5</div>
<div class="mini-calendar-day">6</div>
<div class="mini-calendar-day bg-primary text-white rounded-full">7</div>
<div class="mini-calendar-day">8</div>
<div class="mini-calendar-day">9</div>
<div class="mini-calendar-day">10</div>
<div class="mini-calendar-day">11</div>
</div>
</div>
<!-- Right: Schedule List -->
<div class="col-span-7 space-y-3" data-purpose="to-do-list">
<h2 class="text-sm font-semibold text-gray-600 px-1">Today's Focus</h2>
<!-- Task Item -->
<div class="bg-white p-3 rounded-2xl shadow-sm flex items-center justify-between border-l-4 border-primary">
<div>
<p class="text-xs font-medium text-gray-800">Morning Yoga</p>
<p class="text-[10px] text-gray-400">07:30 AM</p>
</div>
<div class="flex gap-2">
<button class="text-[10px] text-gray-300 hover:text-gray-500 transition-colors">Edit</button>
<button class="text-[10px] text-gray-300 hover:text-red-300 transition-colors">Del</button>
</div>
</div>
<!-- Task Item -->
<div class="bg-white p-3 rounded-2xl shadow-sm flex items-center justify-between border-l-4 border-pink-200">
<div>
<p class="text-xs font-medium text-gray-800">Matcha Break</p>
<p class="text-[10px] text-gray-400">10:00 AM</p>
</div>
<div class="flex gap-2">
<button class="text-[10px] text-gray-300 hover:text-gray-500 transition-colors">Edit</button>
<button class="text-[10px] text-gray-300 hover:text-red-300 transition-colors">Del</button>
</div>
</div>
<!-- Task Item -->
<div class="bg-white p-3 rounded-2xl shadow-sm flex items-center justify-between border-l-4 border-pink-200">
<div>
<p class="text-xs font-medium text-gray-800">Reading Session</p>
<p class="text-[10px] text-gray-400">08:00 PM</p>
</div>
<div class="flex gap-2">
<button class="text-[10px] text-gray-300 hover:text-gray-500 transition-colors">Edit</button>
<button class="text-[10px] text-gray-300 hover:text-red-300 transition-colors">Del</button>
</div>
</div>
</div>
</section>
<!-- END: Middle Dashboard -->
<!-- BEGIN: Weekly Journal Section -->
<section class="space-y-3" data-purpose="weekly-journal">
<div class="flex justify-between items-center px-1">
<h2 class="text-sm font-semibold text-gray-600">Weekly Journal</h2>
<span class="text-[10px] text-primary font-medium">Week 41</span>
</div>
<div class="grid grid-cols-1 gap-2">
<!-- Monday Entry -->
<div class="bg-white/60 p-3 rounded-2xl flex flex-col gap-1 border border-pink-50" data-purpose="journal-entry">
<div class="flex justify-between items-center">
<span class="text-[10px] font-bold text-pink-400 uppercase">Mon</span>
<div class="flex gap-2">
<button class="text-[9px] text-gray-400">Edit</button>
<button class="text-[9px] text-gray-400">Delete</button>
</div>
</div>
<p class="text-xs text-gray-500 italic">"Feeling refreshed after a long walk..."</p>
</div>
<!-- Tuesday Entry -->
<div class="bg-white/60 p-3 rounded-2xl flex flex-col gap-1 border border-pink-50" data-purpose="journal-entry">
<div class="flex justify-between items-center">
<span class="text-[10px] font-bold text-pink-400 uppercase">Tue</span>
<div class="flex gap-2">
<button class="text-[9px] text-gray-400">Edit</button>
<button class="text-[9px] text-gray-400">Delete</button>
</div>
</div>
<p class="text-xs text-gray-500 italic">"Tried a new tea today, it was lovely."</p>
</div>
<!-- Wed-Sun Placeholders -->
<div class="grid grid-cols-2 gap-2">
<div class="bg-pink-100/30 p-3 rounded-2xl border border-dashed border-pink-200">
<span class="text-[10px] font-bold text-pink-300 uppercase">Wed</span>
</div>
<div class="bg-pink-100/30 p-3 rounded-2xl border border-dashed border-pink-200">
<span class="text-[10px] font-bold text-pink-300 uppercase">Thu</span>
</div>
<div class="bg-pink-100/30 p-3 rounded-2xl border border-dashed border-pink-200">
<span class="text-[10px] font-bold text-pink-300 uppercase">Fri</span>
</div>
<div class="bg-pink-100/30 p-3 rounded-2xl border border-dashed border-pink-200">
<span class="text-[10px] font-bold text-pink-300 uppercase">Sat</span>
</div>
</div>
<div class="bg-pink-100/30 p-3 rounded-2xl border border-dashed border-pink-200">
<span class="text-[10px] font-bold text-pink-300 uppercase">Sun</span>
</div>
</div>
</section>
<!-- END: Weekly Journal Section -->
</main>
<!-- BEGIN: Navigation Bar -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] glass-card rounded-full-custom p-2 flex justify-around items-center shadow-lg" data-purpose="bottom-nav">
<button class="p-2 text-primary">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1.5 1.5 0 001.5 1.5h3a1.5 1.5 0 001.5-1.5v-4a.5.5 0 01.5-.5h2a.5.5 0 01.5.5v4a1.5 1.5 0 001.5 1.5h3a1.5 1.5 0 001.5-1.5V10M9 21h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button class="bg-primary text-white p-3 rounded-full shadow-md transform -translate-y-2">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button class="p-2 text-gray-400">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</nav>
<!-- END: Navigation Bar -->
</body></html>
