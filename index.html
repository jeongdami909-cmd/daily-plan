<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aesthetic Scheduler</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#738276', secondary: '#e9ece6', accent: '#e8306e', 
            glassBg: 'rgba(255, 255, 255, 0.7)', glassBorder: 'rgba(255, 255, 255, 0.8)',
          },
          fontFamily: { sans: ['Pretendard', '-apple-system', 'sans-serif'], },
          borderRadius: { '2xl-custom': '1.2rem', },
          boxShadow: { 'glass': '0 8px 30px 0 rgba(0, 0, 0, 0.05)', }
        }
      }
    }
</script>
<style>
    body {
      font-family: 'Pretendard', sans-serif;
      /* 배경 사진 기본값 */
      background-image: url('https://images.unsplash.com/photo-1618331835717-80d5a0a08c1e?q=80&w=2574&auto=format&fit=crop');
      background-size: cover; background-position: center; background-attachment: fixed; color: #333333;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .glass-card {
        background: var(--glassBg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
        border: 1px solid var(--glassBorder); box-shadow: var(--tw-shadow-glass); transition: all 0.3s ease;
    }
    
    /* 💡 요청하신 짙은 회색 + 은은한 골드 테두리 타이틀 */
    .gold-title {
        color: #4a4a4a; 
        font-weight: 600; 
        font-size: 1.2rem; 
        -webkit-text-stroke: 0.3px rgba(218, 165, 32, 0.7); 
        text-shadow: 0px 0px 8px rgba(218, 165, 32, 0.35); 
        letter-spacing: 0.03em;
    }

    /* 💡 요청하신 아내(안에) 들어가는 회색선 + 골드 안내 글자 */
    .gold-guide-text {
        color: #666666;
        font-size: 0.8rem;
        font-weight: 500;
        border-bottom: 1px solid rgba(218, 165, 32, 0.4);
        padding-bottom: 3px;
        text-shadow: 0px 0px 5px rgba(218, 165, 32, 0.2);
        display: inline-block;
    }

    /* 💡 달력 칸: 겹치지 않고 깔끔한 정사각형 유지 */
    .calendar-day {
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 6px 2px; font-weight: 600; cursor: pointer;
      border-radius: 12px; 
      transition: all 0.2s ease-in-out; color: #444;
      position: relative; overflow: hidden; 
      background-color: rgba(255, 255, 255, 0.55); 
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      aspect-ratio: 1 / 1.1; /* 완벽한 비율로 찌그러짐 방지 */
    }
    .calendar-day:hover:not(.empty-day) { background-color: rgba(255, 255, 255, 1); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .calendar-day.empty-day { cursor: default; background: transparent; box-shadow: none; border: none; }
    .calendar-day.today { color: #e8306e; background-color: rgba(255,255,255,0.9); border: 2px solid rgba(232, 48, 110, 0.4); }

    .date-num { font-size: 0.9rem; line-height: 1; z-index: 2; }
    
    /* 달력 내부 지저분한 글씨 삭제 -> 심플한 점(Dot)과 이모지만 표시 */
    .task-dot-container { display: flex; gap: 2px; margin-top: auto; padding-bottom: 4px; z-index: 2; }
    .task-dot { width: 5px; height: 5px; background-color: #738276; border-radius: 50%; opacity: 0.8; }
    .special-dot { background-color: #e8306e; } /* 기념일은 핑크 점 */

    /* 달력 칸 안의 대표 사진/스티커 (배경처럼 은은하게) */
    .cal-thumb-bg {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; opacity: 0.3; z-index: 1; border-radius: 12px;
    }
    .cal-emoji-center {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        font-size: 1.5rem; z-index: 1; opacity: 0.8;
    }

    /* 액션 버튼들 */
    .action-btn { font-size: 0.7rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; transition: 0.2s; border: 1px solid #eee; background: white; }
    .action-btn.edit { color: #3b82f6; } .action-btn.edit:hover { background: #eff6ff; border-color: #bfdbfe; }
    .action-btn.delete { color: #ef4444; } .action-btn.delete:hover { background: #fef2f2; border-color: #fecaca; }
    .action-btn.remove { color: #f97316; font-size: 0.6rem; padding: 2px 4px;} .action-btn.remove:hover { background: #fff7ed; border-color: #fed7aa; }

</style>
</head>
<body class="min-h-screen pb-10">

<div class="fixed top-4 right-4 flex gap-2 z-40">
    <label class="cursor-pointer bg-white/50 hover:bg-white/90 text-gray-700 text-xs px-4 py-2 rounded-full backdrop-blur-md shadow-sm transition border border-white/60 font-semibold">
        📷 배경 사진 변경
        <input type="file" class="hidden" accept="image/*" onchange="changeBackground(event)">
    </label>
</div>

<div class="h-[60vh] w-full pointer-events-none transition-all ease-in-out duration-500"></div>

<main class="max-w-2xl mx-auto px-4 relative z-10 space-y-6 pb-20">
  
  <section class="glass-card p-4 md:p-6 rounded-2xl-custom">
    <div class="flex justify-between items-center mb-5 border-b border-gray-200/50 pb-3">
        <div class="flex items-center gap-3">
            <button onclick="changeMonth(-1)" class="p-1.5 rounded-full text-gray-500 hover:bg-white transition text-sm font-bold shadow-sm">❮</button>
            <h2 id="calendar-month-year" class="gold-title"></h2>
            <button onclick="changeMonth(1)" class="p-1.5 rounded-full text-gray-500 hover:bg-white transition text-sm font-bold shadow-sm">❯</button>
        </div>
        <button onclick="goToToday()" class="text-[10px] font-bold text-white bg-primary px-3 py-1.5 rounded-lg hover:bg-primary/90 transition shadow-md">오늘 날짜로</button>
    </div>
    
    <div class="grid grid-cols-7 gap-2 mb-2 text-center">
        <div class="text-[11px] font-bold text-red-400">일</div>
        <div class="text-[11px] font-bold text-gray-500">월</div>
        <div class="text-[11px] font-bold text-gray-500">화</div>
        <div class="text-[11px] font-bold text-gray-500">수</div>
        <div class="text-[11px] font-bold text-gray-500">목</div>
        <div class="text-[11px] font-bold text-gray-500">금</div>
        <div class="text-[11px] font-bold text-blue-400">토</div>
    </div>
    
    <div class="grid grid-cols-7 gap-2" id="calendar-grid"></div>
  </section>

  <section class="glass-card p-5 md:p-6 rounded-2xl-custom">
    <div class="flex justify-between items-center mb-4 border-b border-gray-200/50 pb-2">
      <h2 class="gold-title text-lg">자유 기록장</h2>
      <button onclick="addJournal()" class="text-[10px] font-bold text-gray-600 bg-white/80 border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-white transition shadow-sm">+ 새 기록 적기</button>
    </div>
    <div id="free-journal-list" class="flex flex-col gap-4 max-h-[300px] overflow-y-auto custom-scrollbar pr-2 w-full"></div>
  </section>

</main>

<div id="dateHubModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 backdrop-blur-sm px-4">
    <div class="bg-white/95 backdrop-blur-xl p-6 rounded-2xl-custom w-full max-w-md shadow-2xl relative max-h-[85vh] flex flex-col">
        <button onclick="closeDateHub()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-800 bg-gray-100 p-2 rounded-full text-xs">✕</button>
        
        <h3 id="hubDateTitle" class="gold-title text-xl mb-4 text-center"></h3>
        
        <div class="overflow-y-auto pr-2 custom-scrollbar flex-1 space-y-6">
            
            <div class="bg-pink-50/50 p-4 rounded-xl border border-pink-100/50">
                <div class="flex justify-between items-center mb-2">
                    <span class="gold-guide-text !border-pink-200 !text-pink-600 !text-shadow-none">💖 특별한 날 (기념일)</span>
                    <button onclick="setSpecialDayHub()" class="action-btn !text-pink-500 !border-pink-200 hover:!bg-pink-100">수정/적기</button>
                </div>
                <p id="hubSpecialDayText" class="text-sm font-bold text-gray-800 ml-1"></p>
            </div>

            <div class="bg-gray-50/50 p-4 rounded-xl border border-gray-100">
                <div class="flex justify-between items-center mb-3">
                    <span class="gold-guide-text">✨ 붙여진 스티커 & 사진</span>
                    <button onclick="openStickerModalFromHub()" class="action-btn !text-primary hover:!bg-gray-100">+ 붙이기</button>
                </div>
                <div id="hubStickersList" class="flex flex-col gap-2">
                    </div>
            </div>

            <div class="bg-gray-50/50 p-4 rounded-xl border border-gray-100">
                <div class="flex justify-between items-center mb-3">
                    <span class="gold-guide-text">🗓️ 오늘의 일정</span>
                    <button onclick="addTaskFromHub()" class="action-btn !text-primary hover:!bg-gray-100">+ 일정 추가</button>
                </div>
                <div id="hubTasksList" class="flex flex-col gap-3">
                    </div>
            </div>

        </div>
    </div>
</div>

<div id="stickerModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-[60] backdrop-blur-sm px-4">
    <div class="bg-white p-6 rounded-2xl-custom w-full max-w-xs shadow-2xl relative">
        <button onclick="closeStickerModal()" class="absolute top-3 right-3 text-gray-400 bg-gray-100 p-1.5 rounded-full text-xs">✕</button>
        <h3 class="gold-title text-lg mb-4">스티커 & 사진 붙이기</h3>
        
        <div class="grid grid-cols-5 gap-2 mb-5">
            <button onclick="saveSticker('☕')" class="text-2xl hover:scale-110 bg-gray-50 rounded-lg p-2 transition">☕</button>
            <button onclick="saveSticker('💻')" class="text-2xl hover:scale-110 bg-gray-50 rounded-lg p-2 transition">💻</button>
            <button onclick="saveSticker('🏋️')" class="text-2xl hover:scale-110 bg-gray-50 rounded-lg p-2 transition">🏋️</button>
            <button onclick="saveSticker('📖')" class="text-2xl hover:scale-110 bg-gray-50 rounded-lg p-2 transition">📖</button>
            <button onclick="saveSticker('✈️')" class="text-2xl hover:scale-110 bg-gray-50 rounded-lg p-2 transition">✈️</button>
            <button onclick="saveSticker('💊')" class="text-2xl hover:scale-110 bg-gray-50 rounded-lg p-2 transition">💊</button>
            <button onclick="saveSticker('🎂')" class="text-2xl hover:scale-110 bg-gray-50 rounded-lg p-2 transition">🎂</button>
            <button onclick="saveSticker('🌙')" class="text-2xl hover:scale-110 bg-gray-50 rounded-lg p-2 transition">🌙</button>
            <button onclick="saveSticker('🥰')" class="text-2xl hover:scale-110 bg-gray-50 rounded-lg p-2 transition">🥰</button>
            <button onclick="saveSticker('😭')" class="text-2xl hover:scale-110 bg-gray-50 rounded-lg p-2 transition">😭</button>
        </div>
        
        <label class="cursor-pointer block w-full text-center border-2 border-dashed border-primary text-primary font-bold text-[11px] py-3 rounded-lg hover:bg-primary/10 transition">
            📷 내 갤러리 사진 붙이기
            <input type="file" class="hidden" accept="image/*" onchange="handleImageSticker(event)">
        </label>
    </div>
</div>

<div id="taskModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-[60] backdrop-blur-sm px-4">
  <div class="bg-white p-6 rounded-2xl-custom w-full max-w-sm shadow-2xl relative">
    <button onclick="closeTaskModal()" class="absolute top-4 right-4 text-gray-400 bg-gray-100 p-1.5 rounded-full text-xs">✕</button>
    <h3 id="modalTitle" class="gold-title text-lg mb-5">일정 추가</h3>
    
    <input type="hidden" id="modalTaskId">
    
    <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">시간 (선택)</label>
        <input type="time" id="modalTime" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-primary text-sm font-medium">
    </div>

    <div class="mb-6">
      <label class="block text-xs font-bold text-gray-500 mb-1">일정 내용</label>
      <textarea id="modalTitleInput" rows="3" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-primary resize-none text-sm" placeholder="내용을 적어주세요."></textarea>
    </div>

    <button onclick="saveTaskFromModal()" class="w-full py-2.5 text-sm font-bold text-white bg-primary rounded-xl hover:bg-opacity-90 shadow-md">저장 완료</button>
  </div>
</div>

<div id="journalModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-[60] backdrop-blur-sm px-4">
    <div class="bg-white p-6 rounded-2xl-custom w-full max-w-md shadow-2xl relative">
      <button onclick="closeJournalModal()" class="absolute top-4 right-4 text-gray-400 bg-gray-100 p-1.5 rounded-full text-xs">✕</button>
      <h3 id="jModalTitle" class="gold-title text-lg mb-5">기록 작성</h3>
      <input type="hidden" id="jModalId">
      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">날짜/제목 (안내선 디자인)</label>
        <input type="text" id="jModalDateStr" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-primary text-sm" placeholder="예: 2/25일의 일기">
      </div>
      <div class="mb-6">
        <label class="block text-xs font-bold text-gray-500 mb-1">내용</label>
        <textarea id="jModalContent" rows="5" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-primary resize-none text-sm" placeholder="마음속 이야기를 적어보세요."></textarea>
      </div>
      <button onclick="saveJournalFromModal()" class="w-full py-2.5 text-sm font-bold text-white bg-primary rounded-xl hover:bg-opacity-90 shadow-md">기록 저장</button>
    </div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('dreamy_tasks_v5')) || {};
  let specialDays = JSON.parse(localStorage.getItem('dreamy_special_days_v2')) || {}; 
  let stickers = JSON.parse(localStorage.getItem('dreamy_stickers_v2')) || {};
  let freeJournals = JSON.parse(localStorage.getItem('dreamy_journal_v3')) || []; 
  
  const monthNames = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];
  const weekDaysKor = ["일", "월", "화", "수", "목", "금", "토"];
  let currentDate = new Date();
  let hubSelectedDateKey = ""; // 모달(허브)에 띄워진 날짜

  const savedBg = localStorage.getItem('dreamy_bg');
  if(savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;
  function changeBackground(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) { document.body.style.backgroundImage = `url('${e.target.result}')`; localStorage.setItem('dreamy_bg', e.target.result); };
      reader.readAsDataURL(file);
    }
  }

  function formatDateKey(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }

  // === 💡 달력 렌더링 (지저분한 글씨 빼고 심플하게) ===
  function renderCalendar() {
    const year = currentDate.getFullYear(); const month = currentDate.getMonth(); const today = new Date();
    document.getElementById('calendar-month-year').innerText = `${year}년 ${monthNames[month]}`;
    const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    let html = '';
    for (let i = 0; i < firstDay; i++) html += `<div class="calendar-day empty-day"></div>`;
    
    for (let i = 1; i <= daysInMonth; i++) {
      const iterDate = new Date(year, month, i); const dateKey = formatDateKey(iterDate);
      const isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear());
      
      let classes = `calendar-day`; 
      if (isToday) classes += " today"; 

      // 달력을 누르면 Date Hub 모달 열림!
      html += `<div class="${classes}" onclick="openDateHub('${year}', '${month}', '${i}', '${dateKey}', ${iterDate.getDay()})">`;
      
      html += `<span class="date-num pointer-events-none">${i}</span>`;

      // 스티커 중 첫번째 것을 달력 칸 전체 배경이나 중앙에 희미하게 표시 (공간 아끼기)
      let bgHtml = '';
      if (stickers[dateKey] && stickers[dateKey].length > 0) {
          const firstSticker = stickers[dateKey][0];
          if (firstSticker.startsWith('data:image')) {
              bgHtml = `<img src="${firstSticker}" class="cal-thumb-bg pointer-events-none">`;
          } else {
              bgHtml = `<span class="cal-emoji-center pointer-events-none">${firstSticker}</span>`;
          }
      }
      html += bgHtml;

      // 하단에는 일정 개수만큼 작은 점(Dot)만 깔끔하게 표시
      let dotHtml = '';
      let hasSpecial = specialDays[dateKey] ? true : false;
      let normalCount = tasks[dateKey] ? tasks[dateKey].length : 0;

      if (hasSpecial || normalCount > 0) {
          dotHtml += `<div class="task-dot-container pointer-events-none">`;
          if (hasSpecial) dotHtml += `<div class="task-dot special-dot"></div>`;
          for(let j=0; j<Math.min(normalCount, 3); j++) dotHtml += `<div class="task-dot"></div>`;
          dotHtml += `</div>`;
      }
      html += dotHtml;

      html += `</div>`;
    }
    document.getElementById('calendar-grid').innerHTML = html;
  }

  function changeMonth(step) { currentDate.setMonth(currentDate.getMonth() + step); renderCalendar(); }
  function goToToday() { currentDate = new Date(); renderCalendar(); }

  // === 💡 날짜 허브(통합 모달) 제어 ===
  function openDateHub(year, month, day, dateKey, dayIndex) {
      hubSelectedDateKey = dateKey;
      const titleStr = `${year}년 ${parseInt(month)+1}월 ${day}일 (${weekDaysKor[dayIndex]})`;
      document.getElementById('hubDateTitle').innerText = titleStr;
      
      renderHubContent();
      
      document.getElementById('dateHubModal').classList.remove('hidden');
      document.getElementById('dateHubModal').classList.add('flex');
  }
  
  function closeDateHub() { 
      document.getElementById('dateHubModal').classList.add('hidden'); 
      document.getElementById('dateHubModal').classList.remove('flex'); 
      renderCalendar(); // 모달 닫을때 달력 점/사진 상태 갱신
  }

  function renderHubContent() {
      // 1. 기념일
      const sdText = specialDays[hubSelectedDateKey] || "지정된 기념일이 없습니다.";
      document.getElementById('hubSpecialDayText').innerText = specialDays[hubSelectedDateKey] ? `🎉 ${sdText}` : sdText;

      // 2. 스티커/사진 리스트 (떼기 버튼 포함)
      const stListEl = document.getElementById('hubStickersList');
      const stArr = stickers[hubSelectedDateKey] || [];
      if (stArr.length === 0) {
          stListEl.innerHTML = `<span class="text-xs text-gray-400">붙여진 스티커가 없습니다.</span>`;
      } else {
          let stHtml = '';
          stArr.forEach((st, idx) => {
              const content = st.startsWith('data:image') 
                ? `<img src="${st}" class="w-12 h-12 object-cover rounded-lg border border-gray-200">` 
                : `<span class="text-2xl">${st}</span>`;
              stHtml += `
              <div class="flex items-center justify-between bg-white p-2 rounded-lg border border-gray-100 shadow-sm">
                  <div class="flex items-center gap-2">${content}</div>
                  <button onclick="removeStickerFromHub(${idx})" class="action-btn remove">떼기 ✕</button>
              </div>`;
          });
          stListEl.innerHTML = stHtml;
      }

      // 3. 일정 리스트 (수정/삭제 버튼 포함)
      const tkListEl = document.getElementById('hubTasksList');
      const tkArr = tasks[hubSelectedDateKey] || [];
      if (tkArr.length === 0) {
          tkListEl.innerHTML = `<span class="text-xs text-gray-400">등록된 일정이 없습니다.</span>`;
      } else {
          let tkHtml = '';
          tkArr.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
          tkArr.forEach(t => {
              tkHtml += `
              <div class="flex flex-col bg-white p-3 rounded-lg border border-gray-100 shadow-sm gap-2">
                  <div class="flex justify-between items-start">
                      <div class="flex items-center gap-2">
                          ${t.time ? `<span class="text-[10px] font-bold text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded">${t.time}</span>` : ''}
                      </div>
                      <div class="flex gap-1">
                          <button onclick="editTaskFromHub(${t.id})" class="action-btn edit">수정</button>
                          <button onclick="deleteTaskFromHub(${t.id})" class="action-btn delete">삭제</button>
                      </div>
                  </div>
                  <span class="text-sm font-semibold text-gray-700 whitespace-pre-wrap">${t.title}</span>
              </div>`;
          });
          tkListEl.innerHTML = tkHtml;
      }
  }

  // 허브 안의 기념일 작성
  function setSpecialDayHub() {
      const currentVal = specialDays[hubSelectedDateKey] || "";
      const newVal = prompt(`기념일이나 특별한 날을 적어주세요!\n(삭제하려면 내용을 비우고 확인)`, currentVal);
      if (newVal === null) return;
      if (newVal.trim() === "") delete specialDays[hubSelectedDateKey];
      else specialDays[hubSelectedDateKey] = newVal.trim();
      localStorage.setItem('dreamy_special_days_v2', JSON.stringify(specialDays));
      renderHubContent();
  }

  // === 스티커 모달 & 로직 ===
  function openStickerModalFromHub() {
      document.getElementById('stickerModal').classList.remove('hidden');
      document.getElementById('stickerModal').classList.add('flex');
  }
  function closeStickerModal() { document.getElementById('stickerModal').classList.add('hidden'); document.getElementById('stickerModal').classList.remove('flex'); }
  
  function saveSticker(val) {
      if (!stickers[hubSelectedDateKey]) stickers[hubSelectedDateKey] = [];
      stickers[hubSelectedDateKey].push(val);
      localStorage.setItem('dreamy_stickers_v2', JSON.stringify(stickers));
      closeStickerModal(); renderHubContent();
  }
  function handleImageSticker(event) {
      const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
      reader.onload = function(e) {
          const img = new Image(); img.onload = function() {
              const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
              const MAX_SIZE = 150; let width = img.width; let height = img.height;
              if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
              canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height);
              saveSticker(canvas.toDataURL('image/jpeg', 0.8));
          }; img.src = e.target.result;
      }; reader.readAsDataURL(file);
  }
  function removeStickerFromHub(index) {
      stickers[hubSelectedDateKey].splice(index, 1);
      if (stickers[hubSelectedDateKey].length === 0) delete stickers[hubSelectedDateKey];
      localStorage.setItem('dreamy_stickers_v2', JSON.stringify(stickers));
      renderHubContent();
  }

  // === 일정 추가 모달 & 로직 ===
  function addTaskFromHub() {
      document.getElementById('modalTitle').innerText = '일정 추가';
      document.getElementById('modalTaskId').value = ''; 
      document.getElementById('modalTime').value = ''; 
      document.getElementById('modalTitleInput').value = ''; 
      document.getElementById('taskModal').classList.remove('hidden'); document.getElementById('taskModal').classList.add('flex');
  }
  function editTaskFromHub(id) {
      const task = tasks[hubSelectedDateKey].find(t => t.id === id); if (!task) return;
      document.getElementById('modalTitle').innerText = '일정 수정';
      document.getElementById('modalTaskId').value = task.id; 
      document.getElementById('modalTime').value = task.time || ''; 
      document.getElementById('modalTitleInput').value = task.title; 
      document.getElementById('taskModal').classList.remove('hidden'); document.getElementById('taskModal').classList.add('flex');
  }
  function closeTaskModal() { document.getElementById('taskModal').classList.add('hidden'); document.getElementById('taskModal').classList.remove('flex'); }

  function saveTaskFromModal() {
      const title = document.getElementById('modalTitleInput').value.trim(); if (!title) { alert('내용을 입력하세요.'); return; }
      const time = document.getElementById('modalTime').value; 
      const editId = document.getElementById('modalTaskId').value;
      
      if (!tasks[hubSelectedDateKey]) tasks[hubSelectedDateKey] = [];
      if (editId) {
          const idx = tasks[hubSelectedDateKey].findIndex(t => t.id == editId); 
          if(idx > -1) tasks[hubSelectedDateKey][idx] = { id: tasks[hubSelectedDateKey][idx].id, title, time };
      } else {
          tasks[hubSelectedDateKey].push({ id: Date.now(), title, time }); 
      }
      localStorage.setItem('dreamy_tasks_v5', JSON.stringify(tasks));
      closeTaskModal(); renderHubContent();
  }
  function deleteTaskFromHub(id) {
      if (!confirm("삭제하시겠습니까?")) return;
      tasks[hubSelectedDateKey] = tasks[hubSelectedDateKey].filter(t => t.id !== id);
      if(tasks[hubSelectedDateKey].length === 0) delete tasks[hubSelectedDateKey];
      localStorage.setItem('dreamy_tasks_v5', JSON.stringify(tasks));
      renderHubContent();
  }

  // === 자유 기록장 ===
  function renderFreeJournals() {
      const listEl = document.getElementById('free-journal-list');
      if (freeJournals.length === 0) {
          listEl.innerHTML = `<div class="text-center py-6 text-gray-400 text-sm border-2 border-dashed border-gray-200 rounded-xl cursor-pointer hover:bg-white" onclick="addJournal()">
              <span class="gold-guide-text !border-none !shadow-none">작성된 기록이 없습니다. 눌러서 적어보세요.</span>
          </div>`; return;
      }
      let html = '';
      freeJournals.forEach((j) => {
          html += `
          <div class="bg-white/80 p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col hover:bg-white transition">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-100">
              <span class="text-xs font-bold text-primary">${j.dateStr}</span>
              <div class="flex gap-1">
                <button onclick="editJournal(${j.id})" class="action-btn edit !text-[9px]">수정</button>
                <button onclick="deleteJournal(${j.id})" class="action-btn delete !text-[9px]">삭제</button>
              </div>
            </div>
            <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">${j.content}</p>
          </div>`;
      });
      listEl.innerHTML = html;
  }
  function openJournalModal() { document.getElementById('journalModal').classList.remove('hidden'); document.getElementById('journalModal').classList.add('flex'); }
  function closeJournalModal() { document.getElementById('journalModal').classList.add('hidden'); document.getElementById('journalModal').classList.remove('flex'); }

  function addJournal() { document.getElementById('jModalTitle').innerText = '기록 작성'; document.getElementById('jModalId').value = ''; document.getElementById('jModalDateStr').value = ''; document.getElementById('jModalContent').value = ''; openJournalModal(); }
  function editJournal(id) {
      const j = freeJournals.find(x => x.id === id); if (!j) return;
      document.getElementById('jModalTitle').innerText = '기록 수정'; document.getElementById('jModalId').value = j.id;
      document.getElementById('jModalDateStr').value = j.dateStr; document.getElementById('jModalContent').value = j.content; openJournalModal();
  }
  function saveJournalFromModal() {
      const dateStr = document.getElementById('jModalDateStr').value.trim(); const content = document.getElementById('jModalContent').value.trim(); const editId = document.getElementById('jModalId').value;
      if (!dateStr || !content) return;
      if (editId) { const idx = freeJournals.findIndex(x => x.id == editId); if (idx > -1) { freeJournals[idx].dateStr = dateStr; freeJournals[idx].content = content; } } 
      else { freeJournals.unshift({ id: Date.now(), dateStr, content }); }
      localStorage.setItem('dreamy_journal_v3', JSON.stringify(freeJournals)); closeJournalModal(); renderFreeJournals();
  }
  function deleteJournal(id) {
      if (!confirm("삭제하시겠습니까?")) return;
      freeJournals = freeJournals.filter(x => x.id !== id); localStorage.setItem('dreamy_journal_v3', JSON.stringify(freeJournals)); renderFreeJournals();
  }

  // 초기화
  goToToday(); renderFreeJournals();
</script>
</body>
</html>
