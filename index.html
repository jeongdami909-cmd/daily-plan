<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dreamy Scheduler</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e8306e',
            softPink: '#fff5f7',
            pastelPink: '#fce4ec',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          borderRadius: {
            'full-custom': '9999px',
          }
        }
      }
    }
</script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fff5f7; 
      color: #4a4a4a;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .mini-calendar-day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 9999px;
      transition: all 0.2s;
    }
    .mini-calendar-day:hover:not(.empty-day) {
      background-color: #fce4ec;
    }
    .mini-calendar-day.empty-day {
      cursor: default;
      color: #d1d5db; /* gray-300 */
    }
    .mini-calendar-day.today {
      background-color: #e8306e;
      color: white;
      font-weight: bold;
    }
    .mini-calendar-day.selected:not(.today) {
      box-shadow: 0 0 0 2px #e8306e inset;
      font-weight: bold;
    }
</style>
</head>
<body class="min-h-screen pb-10">

<header class="relative w-full h-64 overflow-hidden group">
  <img id="hero-img" alt="Cover" class="w-full h-full object-cover opacity-80" src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=800&q=80"/>
  <div class="absolute inset-0 bg-gradient-to-b from-transparent to-softPink/90 flex flex-col justify-end p-6">
    <div class="flex justify-between items-end">
      <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Daily Glow</h1>
      <label class="cursor-pointer bg-white/60 hover:bg-white/90 text-gray-800 text-xs px-3 py-1.5 rounded-full backdrop-blur-sm shadow-sm transition flex items-center gap-1">
        <span>📷 커버 변경</span>
        <input type="file" id="bg-upload" class="hidden" accept="image/*" onchange="changeBackground(event)">
      </label>
    </div>
  </div>
</header>
<main class="px-4 -mt-4 relative z-10 space-y-6">
  <section class="grid grid-cols-12 gap-4">
    
    <div class="col-span-5 bg-white/80 p-3 rounded-3xl shadow-sm border border-pink-100">
      <div class="flex justify-between items-center mb-2 px-1">
        <button onclick="changeMonth(-1)" class="text-gray-400 hover:text-primary">&lt;</button>
        <span id="calendar-month-year" class="text-[10px] uppercase tracking-widest font-semibold text-primary"></span>
        <button onclick="changeMonth(1)" class="text-gray-400 hover:text-primary">&gt;</button>
      </div>
      <div class="grid grid-cols-7 gap-1" id="calendar-grid">
        </div>
    </div>

    <div class="col-span-7 space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 id="focus-title" class="text-sm font-semibold text-gray-600">Today's Focus</h2>
        <button onclick="addTask()" class="text-[10px] bg-primary text-white px-2 py-1 rounded-full shadow-sm hover:bg-pink-600 transition">+ Add</button>
      </div>
      <div id="task-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
        </div>
    </div>
  </section>
  <section class="space-y-3">
    <div class="flex justify-between items-center px-1">
      <h2 class="text-sm font-semibold text-gray-600">Weekly Journal</h2>
    </div>
    <div id="journal-list" class="grid grid-cols-1 gap-2">
      </div>
  </section>
  </main>

<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] glass-card rounded-full-custom p-2 flex justify-around items-center shadow-lg">
  <button class="p-2 text-primary" onclick="goToToday()">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1.5 1.5 0 001.5 1.5h3a1.5 1.5 0 001.5-1.5v-4a.5.5 0 01.5-.5h2a.5.5 0 01.5.5v4a1.5 1.5 0 001.5 1.5h3a1.5 1.5 0 001.5-1.5V10M9 21h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
  </button>
  <button onclick="addTask()" class="bg-primary text-white p-3 rounded-full shadow-md transform -translate-y-2 hover:scale-105 transition">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
  </button>
  <button class="p-2 text-gray-400">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
  </button>
</nav>

<script>
  // === 데이터 저장소 (로컬 스토리지) ===
  let tasks = JSON.parse(localStorage.getItem('dreamy_tasks')) || {};
  let journal = JSON.parse(localStorage.getItem('dreamy_journal')) || {};
  
  // === 배경 사진 로드 ===
  const savedBg = localStorage.getItem('dreamy_bg');
  if(savedBg) document.getElementById('hero-img').src = savedBg;

  function changeBackground(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('hero-img').src = e.target.result;
        localStorage.setItem('dreamy_bg', e.target.result);
      };
      reader.readAsDataURL(file);
    }
  }

  // === 달력 로직 ===
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  let currentDate = new Date();
  let selectedDate = new Date(); // 사용자가 클릭한 날짜

  function formatDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const today = new Date();
    
    document.getElementById('calendar-month-year').innerText = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    let html = `
      <div class="mini-calendar-day font-bold text-primary">S</div>
      <div class="mini-calendar-day font-bold text-primary">M</div>
      <div class="mini-calendar-day font-bold text-primary">T</div>
      <div class="mini-calendar-day font-bold text-primary">W</div>
      <div class="mini-calendar-day font-bold text-primary">T</div>
      <div class="mini-calendar-day font-bold text-primary">F</div>
      <div class="mini-calendar-day font-bold text-primary">S</div>
    `;

    // 빈 칸 (이전 달)
    for (let i = 0; i < firstDay; i++) {
      html += `<div class="mini-calendar-day empty-day"></div>`;
    }

    // 실제 날짜
    for (let i = 1; i <= daysInMonth; i++) {
      const isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear());
      const isSelected = (i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear());
      
      let classes = "mini-calendar-day";
      if (isToday) classes += " today";
      else if (isSelected) classes += " selected";

      html += `<div class="${classes}" onclick="selectDate(${year}, ${month}, ${i})">${i}</div>`;
    }
    
    document.getElementById('calendar-grid').innerHTML = html;
  }

  function changeMonth(step) {
    currentDate.setMonth(currentDate.getMonth() + step);
    renderCalendar();
  }

  function selectDate(year, month, day) {
    selectedDate = new Date(year, month, day);
    renderCalendar();
    renderTasks();
  }

  function goToToday() {
    currentDate = new Date();
    selectedDate = new Date();
    renderCalendar();
    renderTasks();
  }

  // === 오늘의 포커스(메모) 로직 ===
  function renderTasks() {
    const dateKey = formatDateKey(selectedDate);
    const dayTasks = tasks[dateKey] || [];
    const listEl = document.getElementById('task-list');
    
    // 타이틀 변경
    const isToday = formatDateKey(new Date()) === dateKey;
    document.getElementById('focus-title').innerText = isToday ? "Today's Focus" : `${selectedDate.getDate()} ${monthNames[selectedDate.getMonth()]} Focus`;

    if(dayTasks.length === 0) {
      listEl.innerHTML = `<p class="text-[11px] text-gray-400 text-center py-4">등록된 일정이 없습니다.<br>+ Add를 눌러 추가해보세요!</p>`;
      return;
    }

    let html = '';
    dayTasks.forEach(task => {
      html += `
      <div class="bg-white p-3 rounded-2xl shadow-sm flex items-center justify-between border-l-4 border-primary">
        <div>
          <p class="text-xs font-medium text-gray-800">${task.title}</p>
          <p class="text-[10px] text-gray-400">${task.time || '종일'}</p>
        </div>
        <div class="flex gap-2">
          <button onclick="editTask(${task.id})" class="text-[10px] text-gray-300 hover:text-gray-500">Edit</button>
          <button onclick="deleteTask(${task.id})" class="text-[10px] text-gray-300 hover:text-red-300">Del</button>
        </div>
      </div>`;
    });
    listEl.innerHTML = html;
  }

  function addTask() {
    const title = prompt("추가할 일정/메모를 적어주세요:");
    if (!title) return;
    const time = prompt("시간을 적어주세요 (예: 10:00 AM) \n생략하려면 그냥 확인을 누르세요:") || "";
    
    const dateKey = formatDateKey(selectedDate);
    if (!tasks[dateKey]) tasks[dateKey] = [];
    
    tasks[dateKey].push({ id: Date.now(), title, time });
    localStorage.setItem('dreamy_tasks', JSON.stringify(tasks));
    renderTasks();
  }

  function editTask(id) {
    const dateKey = formatDateKey(selectedDate);
    const task = tasks[dateKey].find(t => t.id === id);
    if (!task) return;

    const newTitle = prompt("일정 수정:", task.title);
    if (newTitle === null) return;
    const newTime = prompt("시간 수정:", task.time);
    
    task.title = newTitle;
    task.time = newTime || "";
    localStorage.setItem('dreamy_tasks', JSON.stringify(tasks));
    renderTasks();
  }

  function deleteTask(id) {
    if (!confirm("이 일정을 삭제할까요?")) return;
    const dateKey = formatDateKey(selectedDate);
    tasks[dateKey] = tasks[dateKey].filter(t => t.id !== id);
    localStorage.setItem('dreamy_tasks', JSON.stringify(tasks));
    renderTasks();
  }

  // === 주간 일기(Journal) 로직 ===
  const weekDays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function renderJournal() {
    let html = '';
    weekDays.forEach(day => {
      const entry = journal[day];
      if (entry) {
        // 일기가 있는 경우
        html += `
        <div class="bg-white/60 p-3 rounded-2xl flex flex-col gap-1 border border-pink-50 shadow-sm">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold text-primary uppercase">${day}</span>
            <div class="flex gap-2">
              <button onclick="editJournal('${day}')" class="text-[9px] text-gray-400 hover:text-primary">Edit</button>
              <button onclick="deleteJournal('${day}')" class="text-[9px] text-gray-400 hover:text-red-300">Del</button>
            </div>
          </div>
          <p class="text-xs text-gray-600 italic leading-relaxed">"${entry}"</p>
        </div>`;
      } else {
        // 일기가 없는 경우 (빈칸 탭)
        html += `
        <div onclick="editJournal('${day}')" class="bg-pink-100/30 p-3 rounded-2xl border border-dashed border-pink-200 cursor-pointer hover:bg-pink-100/60 transition flex justify-between items-center">
          <span class="text-[10px] font-bold text-pink-300 uppercase">${day}</span>
          <span class="text-[10px] text-pink-300">+ Add</span>
        </div>`;
      }
    });
    document.getElementById('journal-list').innerHTML = html;
  }

  function editJournal(day) {
    const currentEntry = journal[day] || "";
    const newEntry = prompt(`${day}요일의 일기를 적어주세요:`, currentEntry);
    
    if (newEntry === null) return; // 취소 누름
    if (newEntry.trim() === "") {
      delete journal[day]; // 비우면 삭제
    } else {
      journal[day] = newEntry;
    }
    localStorage.setItem('dreamy_journal', JSON.stringify(journal));
    renderJournal();
  }

  function deleteJournal(day) {
    if (!confirm(`${day}요일의 일기를 삭제할까요?`)) return;
    delete journal[day];
    localStorage.setItem('dreamy_journal', JSON.stringify(journal));
    renderJournal();
  }

  // === 초기 실행 ===
  renderCalendar();
  renderTasks();
  renderJournal();
</script>
</body>
</html>
