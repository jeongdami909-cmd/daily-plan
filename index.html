<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dreamy Scheduler</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e8306e',
            softPink: '#fff5f7',
            pastelPink: '#fce4ec',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          borderRadius: {
            'full-custom': '9999px',
          }
        }
      }
    }
</script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fff5f7; 
      color: #4a4a4a;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .mini-calendar-day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 9999px;
      transition: all 0.2s;
    }
    .mini-calendar-day:hover:not(.empty-day) {
      background-color: #fce4ec;
      transform: scale(1.1);
    }
    .mini-calendar-day.empty-day {
      cursor: default;
      color: #d1d5db;
    }
    .mini-calendar-day.today {
      background-color: #e8306e;
      color: white;
      font-weight: bold;
    }
    .mini-calendar-day.selected:not(.today) {
      box-shadow: 0 0 0 2px #e8306e inset;
      font-weight: bold;
      background-color: #fce4ec;
    }
    /* 스크롤바 예쁘게 */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #fce4ec; border-radius: 4px; }
</style>
</head>
<body class="min-h-screen pb-24">

<header class="relative w-full h-64 overflow-hidden group">
  <img id="hero-img" alt="Cover" class="w-full h-full object-cover opacity-80" src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=800&q=80"/>
  <div class="absolute inset-0 bg-gradient-to-b from-transparent to-softPink/90 flex flex-col justify-end p-6">
    <div class="flex justify-between items-end">
      <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Daily Glow</h1>
      <label class="cursor-pointer bg-white/60 hover:bg-white/90 text-gray-800 text-xs px-3 py-1.5 rounded-full backdrop-blur-sm shadow-sm transition flex items-center gap-1">
        <span>📷 커버 변경</span>
        <input type="file" id="bg-upload" class="hidden" accept="image/*" onchange="changeBackground(event)">
      </label>
    </div>
  </div>
</header>
<main class="px-4 -mt-4 relative z-10 space-y-6">
  
  <section class="bg-white/80 p-4 rounded-3xl shadow-sm border border-pink-100">
    <div class="flex justify-between items-center mb-3 px-1">
      <div class="flex gap-3 items-center">
        <button onclick="changeMonth(-1)" class="text-gray-400 hover:text-primary text-lg font-bold">&lt;</button>
        <span id="calendar-month-year" class="text-xs uppercase tracking-widest font-bold text-primary"></span>
        <button onclick="changeMonth(1)" class="text-gray-400 hover:text-primary text-lg font-bold">&gt;</button>
      </div>
      <button onclick="toggleSection('calendar-body')" class="text-xs text-gray-400 hover:text-primary font-medium bg-gray-50 px-2 py-1 rounded-md">달력 접기/펴기 ▾</button>
    </div>
    
    <div id="calendar-body" class="transition-all duration-300">
      <div class="grid grid-cols-7 gap-1" id="calendar-grid">
        </div>
    </div>
  </section>
  <section class="bg-white/60 p-4 rounded-3xl shadow-sm border border-pink-50">
    <div class="flex justify-between items-center px-1 border-b border-pink-100 pb-2 mb-2">
      <h2 id="focus-title" class="text-sm font-bold text-gray-700">Today's Focus</h2>
      <div class="flex gap-2 items-center">
        <button onclick="addTask()" class="text-[10px] bg-primary text-white px-3 py-1.5 rounded-full shadow-sm hover:bg-pink-600 transition font-bold">+ 일정 추가</button>
        <button onclick="toggleSection('task-body')" class="text-xs text-gray-400 hover:text-primary font-medium bg-gray-50 px-2 py-1 rounded-md">목록 접기 ▾</button>
      </div>
    </div>
    
    <div id="task-body" class="transition-all duration-300">
      <div id="task-list" class="space-y-3 max-h-60 overflow-y-auto pr-2">
        </div>
    </div>
  </section>
  <section class="space-y-3 pb-8">
    <div class="flex justify-between items-center px-1">
      <h2 class="text-sm font-semibold text-gray-600">Weekly Journal</h2>
    </div>
    <div id="journal-list" class="grid grid-cols-1 gap-2">
      </div>
  </section>
  </main>

<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] glass-card rounded-full-custom p-2 flex justify-around items-center shadow-lg z-40">
  <button class="p-2 text-primary" onclick="goToToday()" title="오늘로 이동">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1.5 1.5 0 001.5 1.5h3a1.5 1.5 0 001.5-1.5v-4a.5.5 0 01.5-.5h2a.5.5 0 01.5.5v4a1.5 1.5 0 001.5 1.5h3a1.5 1.5 0 001.5-1.5V10M9 21h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
  </button>
  <button onclick="addTask()" class="bg-primary text-white p-3 rounded-full shadow-md transform -translate-y-2 hover:scale-105 transition" title="새 일정 작성">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
  </button>
  <button class="p-2 text-gray-400">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
  </button>
</nav>

<div id="taskModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 backdrop-blur-sm">
  <div class="bg-white p-6 rounded-3xl w-11/12 max-w-md shadow-2xl">
    <h3 id="modalTitle" class="text-lg font-bold text-gray-800 mb-4">일정 추가</h3>
    <input type="hidden" id="modalTaskId"> <div class="mb-4">
      <label class="block text-xs font-semibold text-gray-500 mb-2">시간 (선택)</label>
      <input type="text" id="modalTime" class="w-full border border-gray-200 rounded-xl p-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition" placeholder="예: 오전 10:00">
    </div>
    
    <div class="mb-6">
      <label class="block text-xs font-semibold text-gray-500 mb-2">일정 내용</label>
      <textarea id="modalTitleInput" rows="5" class="w-full border border-gray-200 rounded-xl p-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition resize-none" placeholder="여기에 넓고 편하게 일정을 길~게 적으세요!"></textarea>
    </div>
    
    <div class="flex gap-3 justify-end">
      <button onclick="closeModal()" class="px-5 py-2.5 text-sm font-semibold text-gray-500 bg-gray-100 rounded-xl hover:bg-gray-200 transition">취소</button>
      <button onclick="saveTaskFromModal()" class="px-5 py-2.5 text-sm font-semibold text-white bg-primary rounded-xl hover:bg-pink-600 transition">저장하기</button>
    </div>
  </div>
</div>

<script>
  // === 데이터 저장소 (로컬 스토리지) ===
  let tasks = JSON.parse(localStorage.getItem('dreamy_tasks')) || {};
  let journal = JSON.parse(localStorage.getItem('dreamy_journal')) || {};
  
  // === 배경 사진 로드 ===
  const savedBg = localStorage.getItem('dreamy_bg');
  if(savedBg) document.getElementById('hero-img').src = savedBg;

  function changeBackground(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('hero-img').src = e.target.result;
        localStorage.setItem('dreamy_bg', e.target.result);
      };
      reader.readAsDataURL(file);
    }
  }

  // === 접기/펴기 로직 ===
  function toggleSection(id) {
    const el = document.getElementById(id);
    if (el.classList.contains('hidden')) {
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  // === 달력 로직 ===
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  let currentDate = new Date();
  let selectedDate = new Date(); 

  function formatDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const today = new Date();
    
    document.getElementById('calendar-month-year').innerText = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    let html = `
      <div class="mini-calendar-day font-bold text-primary">S</div>
      <div class="mini-calendar-day font-bold text-primary">M</div>
      <div class="mini-calendar-day font-bold text-primary">T</div>
      <div class="mini-calendar-day font-bold text-primary">W</div>
      <div class="mini-calendar-day font-bold text-primary">T</div>
      <div class="mini-calendar-day font-bold text-primary">F</div>
      <div class="mini-calendar-day font-bold text-primary">S</div>
    `;

    for (let i = 0; i < firstDay; i++) {
      html += `<div class="mini-calendar-day empty-day"></div>`;
    }

    for (let i = 1; i <= daysInMonth; i++) {
      const isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear());
      const isSelected = (i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear());
      
      let classes = "mini-calendar-day";
      if (isToday) classes += " today";
      else if (isSelected) classes += " selected";

      // 달력 날짜 클릭 이벤트
      html += `<div class="${classes}" onclick="selectDate(${year}, ${month}, ${i})">${i}</div>`;
    }
    
    document.getElementById('calendar-grid').innerHTML = html;
  }

  function changeMonth(step) {
    currentDate.setMonth(currentDate.getMonth() + step);
    renderCalendar();
  }

  function selectDate(year, month, day) {
    selectedDate = new Date(year, month, day);
    renderCalendar();
    
    // 날짜를 누르면 자동으로 일정 목록이 펼쳐짐
    document.getElementById('task-body').classList.remove('hidden');
    renderTasks();
  }

  function goToToday() {
    currentDate = new Date();
    selectedDate = new Date();
    renderCalendar();
    document.getElementById('calendar-body').classList.remove('hidden');
    document.getElementById('task-body').classList.remove('hidden');
    renderTasks();
  }

  // === 오늘의 포커스(메모) 로직 ===
  function renderTasks() {
    const dateKey = formatDateKey(selectedDate);
    const dayTasks = tasks[dateKey] || [];
    const listEl = document.getElementById('task-list');
    
    const isToday = formatDateKey(new Date()) === dateKey;
    document.getElementById('focus-title').innerText = isToday ? "Today's Focus" : `${selectedDate.getDate()} ${monthNames[selectedDate.getMonth()]} Focus`;

    if(dayTasks.length === 0) {
      listEl.innerHTML = `
        <div class="bg-gray-50 border border-dashed border-gray-200 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-pink-50 transition" onclick="addTask()">
            <span class="text-3xl mb-2">✍️</span>
            <p class="text-xs text-gray-500 font-medium">등록된 일정이 없습니다.</p>
            <p class="text-[10px] text-primary mt-1">여기를 눌러 새 일정을 추가해보세요!</p>
        </div>`;
      return;
    }

    let html = '';
    dayTasks.forEach(task => {
      html += `
      <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between border-l-4 border-primary">
        <div class="flex-1 pr-4">
          <p class="text-[10px] text-gray-400 mb-1 font-semibold">${task.time || '종일'}</p>
          <p class="text-sm font-medium text-gray-800 whitespace-pre-wrap">${task.title}</p>
        </div>
        <div class="flex flex-col gap-2">
          <button onclick="editTask(${task.id})" class="text-[11px] font-bold text-gray-400 hover:text-primary bg-gray-50 px-2 py-1 rounded">수정</button>
          <button onclick="deleteTask(${task.id})" class="text-[11px] font-bold text-gray-400 hover:text-red-500 bg-gray-50 px-2 py-1 rounded">삭제</button>
        </div>
      </div>`;
    });
    listEl.innerHTML = html;
  }

  // === 모달(Modal) 창 컨트롤 로직 ===
  const modal = document.getElementById('taskModal');
  
  function openModal(id = null) {
    document.getElementById('modalTaskId').value = id || '';
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.getElementById('modalTitleInput').focus();
  }

  function closeModal() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    document.getElementById('modalTitleInput').value = '';
    document.getElementById('modalTime').value = '';
  }

  function addTask() {
    document.getElementById('modalTitle').innerText = '새 일정 추가';
    document.getElementById('modalTitleInput').value = '';
    document.getElementById('modalTime').value = '';
    
    // 일정 추가시 목록이 접혀있으면 자동으로 펼침
    document.getElementById('task-body').classList.remove('hidden');
    openModal();
  }

  function editTask(id) {
    const dateKey = formatDateKey(selectedDate);
    const task = tasks[dateKey].find(t => t.id === id);
    if (!task) return;

    document.getElementById('modalTitle').innerText = '일정 수정';
    document.getElementById('modalTitleInput').value = task.title;
    document.getElementById('modalTime').value = task.time;
    openModal(id);
  }

  function saveTaskFromModal() {
    const title = document.getElementById('modalTitleInput').value.trim();
    const time = document.getElementById('modalTime').value.trim();
    const editId = document.getElementById('modalTaskId').value;

    if (!title) {
      alert("일정 내용을 입력해주세요!");
      return;
    }

    const dateKey = formatDateKey(selectedDate);
    if (!tasks[dateKey]) tasks[dateKey] = [];

    if (editId) {
      // 기존 일정 수정
      const taskIndex = tasks[dateKey].findIndex(t => t.id == editId);
      if(taskIndex > -1) {
        tasks[dateKey][taskIndex].title = title;
        tasks[dateKey][taskIndex].time = time;
      }
    } else {
      // 새 일정 추가
      tasks[dateKey].push({ id: Date.now(), title, time });
    }

    localStorage.setItem('dreamy_tasks', JSON.stringify(tasks));
    closeModal();
    renderTasks();
  }

  function deleteTask(id) {
    if (!confirm("이 일정을 정말 삭제할까요?")) return;
    const dateKey = formatDateKey(selectedDate);
    tasks[dateKey] = tasks[dateKey].filter(t => t.id !== id);
    localStorage.setItem('dreamy_tasks', JSON.stringify(tasks));
    renderTasks();
  }

  // === 주간 일기(Journal) 로직 ===
  const weekDays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function renderJournal() {
    let html = '';
    weekDays.forEach(day => {
      const entry = journal[day];
      if (entry) {
        html += `
        <div class="bg-white/80 p-4 rounded-2xl flex flex-col gap-2 border border-pink-100 shadow-sm relative group">
          <div class="flex justify-between items-center border-b border-pink-50 pb-1">
            <span class="text-[11px] font-bold text-primary uppercase">${day}</span>
            <div class="flex gap-2">
              <button onclick="editJournal('${day}')" class="text-[10px] font-bold text-gray-400 hover:text-primary">수정</button>
              <button onclick="deleteJournal('${day}')" class="text-[10px] font-bold text-gray-400 hover:text-red-500">삭제</button>
            </div>
          </div>
          <p class="text-sm text-gray-700 italic leading-relaxed whitespace-pre-wrap">"${entry}"</p>
        </div>`;
      } else {
        html += `
        <div onclick="editJournal('${day}')" class="bg-pink-100/30 p-4 rounded-2xl border border-dashed border-pink-200 cursor-pointer hover:bg-pink-100/60 transition flex justify-between items-center">
          <span class="text-[11px] font-bold text-pink-400 uppercase">${day}</span>
          <span class="text-xs font-bold text-primary bg-white/50 px-2 py-1 rounded">+ 일기 쓰기</span>
        </div>`;
      }
    });
    document.getElementById('journal-list').innerHTML = html;
  }

  // 주간 일기는 모달 대신 윈도우 프롬프트 사용 (심플하게)
  // 원하시면 주간 일기 전용 모달창을 만들어 드릴 수도 있습니다!
  function editJournal(day) {
    const currentEntry = journal[day] || "";
    const newEntry = prompt(`[${day}요일] 오늘의 일기를 편하게 적어주세요!`, currentEntry);
    
    if (newEntry === null) return; 
    if (newEntry.trim() === "") {
      delete journal[day]; 
    } else {
      journal[day] = newEntry;
    }
    localStorage.setItem('dreamy_journal', JSON.stringify(journal));
    renderJournal();
  }

  function deleteJournal(day) {
    if (!confirm(`${day}요일의 일기를 삭제할까요?`)) return;
    delete journal[day];
    localStorage.setItem('dreamy_journal', JSON.stringify(journal));
    renderJournal();
  }

  // === 초기 실행 ===
  renderCalendar();
  renderTasks();
  renderJournal();
</script>
</body>
</html>
